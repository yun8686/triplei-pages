<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>triplei</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --accent: #1b5e3a;
    --rule: #e2e2e5;
    --card: #f6f7f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f2f2f2;
      --muted: #a3a3a8;
      --accent: #6fcf97;
      --rule: #2c2c2e;
      --card: #1c1e1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.8;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
    color: var(--accent);
  }
  .meta {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 32px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px 24px;
    margin-top: 16px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 1.1rem;
  }
  .card ul {
    margin: 0;
    padding-left: 1.2em;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>

  <div class="card">

      <li><a href="./break100AiCoach.html">プライバシーポリシー</a></li>
      <li><a href="./break100AiCoachSupport.html">サポート</a></li>
    </ul>
  </div>

  <div class="card">
    <h2>カタチ合わせ（Shape Match）</h2>
    <ul>
      <li><a href="./shapePuzzle.html">プライバシーポリシー</a></li>
      <li><a href="./shapePuzzleSupport.html">サポート</a></li>
    </ul>
  </div>
</main>
</body>
</html>
